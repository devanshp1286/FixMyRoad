name: fixmyroad
description: FixMyRoad — Civic pothole reporting platform
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase — auth, db, storage, realtime
  supabase_flutter: ^2.5.6

  # HTTP client for calling AI worker directly
  http: ^1.2.2

  # Maps & location
  google_maps_flutter: ^2.6.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Camera & images
  image_picker: ^1.1.2
  image: ^4.2.0
  cached_network_image: ^3.3.1

  # Local storage (offline drafts)
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Local notifications only (no Firebase for now)
  flutter_local_notifications: ^17.2.2

  # Charts & UI
  fl_chart: ^0.68.0
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/